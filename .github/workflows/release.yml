# Builds the app on GitHub's Mac servers and attaches the .dmg and .zip to a release.
#
# Use it by pushing a version tag:
#     git tag v1.0.0 && git push origin v1.0.0
# or run it by hand from the repository's Actions tab ("Run workflow").
name: Release
# The tag trigger is off on purpose: v1.0.0 was built and tested locally.
# Run this by hand from the Actions tab until its build has been verified.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build the app, .dmg and .zip
        run: ./scripts/build_app.sh

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true

      - name: Keep the files from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: CozyQuickNoteDesk-mac
          path: |
            dist/*.dmg
            dist/*.zip
